[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer"
version = "0.1.5"
description = "Set up an AI pull request reviewer on GitHub Actions from any git repository."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
license = { file = "LICENSE" }
authors = [{ name = "Aariso0" }]
keywords = ["github", "pull-request", "review", "ai", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Aariso0/reviewer"
Repository = "https://github.com/Aariso0/reviewer"
Issues = "https://github.com/Aariso0/reviewer/issues"

[project.scripts]
reviewer = "reviewer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewer = ["data/*.py", "data/*.md"]
