name: Bug report
description: Report a reproducible problem with reviewer.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not include API keys, tokens or private repository contents.
  - type: input
    id: version
    attributes:
      label: reviewer version
      description: Output of `reviewer --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command and redact any secrets.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `reviewer doctor`
      render: shell
    validations:
      required: false
